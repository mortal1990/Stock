<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #2d333b; --text: #e6edf3;
    --muted: #8b949e; --up: #3fb950; --down: #f85149; --neutral: #d29922; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #0d1117; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
    padding: 8px; display: flex; flex-direction: column; gap: 8px;
    max-width: 380px; margin: 0 auto;
  }
  .searchwrap { position: relative; }
  .searchbar { display: flex; gap: 6px; }
  .searchbar input {
    flex: 1; padding: 8px 10px; background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 13px; border-radius: 8px;
  }
  .searchbar input::placeholder { color: var(--muted); }
  .searchbar button {
    padding: 8px 13px; background: var(--accent); color: #0d1117; border: none; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .searcherr { color: var(--down); font-size: 11px; min-height: 12px; padding-left: 2px; }
  .dropdown {
    position: absolute; top: 42px; left: 0; right: 0; z-index: 20;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    max-height: 240px; overflow-y: auto; display: none;
  }
  .dropdown.show { display: block; }
  .opt { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .opt:last-child { border-bottom: none; }
  .opt:hover { background: var(--bg); }
  .opt .t { font-size: 13px; font-weight: 700; }
  .opt .d { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .opt .loading, .opt .empty { color: var(--muted); font-size: 12px; }

  /* გრიდი — ავტომატური მორგება */
  #widgets { display: grid; grid-template-columns: 1fr; gap: 8px; }

  .widget {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--muted);
    border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px;
  }
  .widget.up { border-left-color: var(--up); }
  .widget.down { border-left-color: var(--down); }

  .wleft { flex: 1; min-width: 0; }
  .wl-head { display: flex; justify-content: space-between; align-items: baseline; }
  .sym { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  .name { font-size: 10px; color: var(--muted); margin-left: 5px; }
  .del { color: var(--muted); font-size: 13px; cursor: pointer; line-height: 1; }
  .del:hover { color: var(--down); }
  .price { font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 1px 0; }
  .line { font-size: 11px; color: var(--muted); padding: 1px 0; }
  .line .num { color: var(--text); font-variant-numeric: tabular-nums; }
  .updated { font-size: 9px; color: var(--muted); margin-top: 5px; }
  .up-t { color: var(--up); } .down-t { color: var(--down); } .neutral-t { color: var(--neutral); }

  /* ინვესთმენტი — მარჯვენა ბლოკი */
  .wright {
    width: 120px; border-left: 1px solid var(--border); padding-left: 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .pf-lbl { font-size: 10px; color: var(--muted); }
  .wright input {
    width: 100%; padding: 5px 7px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 11px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .wright input::placeholder { color: var(--muted); font-size: 10px; }
  .pf-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pf-diff { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .foot { text-align: center; font-size: 10px; color: var(--muted); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle; }
  .dot.live { background: var(--up); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .skeleton { color: var(--muted); }
  .keybox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; max-width: 420px; margin: 0 auto; }
  .keybox h2 { font-size: 14px; margin-bottom: 6px; }
  .keybox p { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .keybox p a { color: var(--accent); }
  .keybox input {
    width: 100%; padding: 9px 11px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 12px; margin-bottom: 10px; border-radius: 6px;
  }
  .keybox button {
    width: 100%; padding: 9px; background: var(--accent); color: #0d1117; border: none; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .keyerr { color: var(--down); font-size: 11px; margin-top: 8px; min-height: 14px; }
  .reset { text-align: center; margin-top: 2px; }
  .reset a { color: var(--muted); font-size: 10px; cursor: pointer; text-decoration: underline; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="keyscreen" class="keybox">
  <h2>API გასაღები</h2>
  <p>ჩაწერე Finnhub-ის უფასო გასაღები ერთხელ — ინახება ამ ბრაუზერში, აღარ გკითხავს.
     გასაღები: <a href="https://finnhub.io/register" target="_blank">finnhub.io/register</a></p>
  <input type="text" id="keyInput" placeholder="გასაღები აქ" autocomplete="off">
  <button onclick="saveKey()">შენახვა და დაწყება</button>
  <div class="keyerr" id="keyErr"></div>
</div>

<div id="main" class="hidden">
  <div class="searchwrap">
    <div class="searchbar">
      <input type="text" id="searchInput" placeholder="ჩაწერე კომპანია ან ტიკერი (მაგ. Tesla, TSL)" autocomplete="off">
      <button onclick="addTyped()">დამატება</button>
    </div>
    <div class="dropdown" id="dropdown"></div>
  </div>
  <div class="searcherr" id="searchErr"></div>
  <div id="widgets"></div>
  <div class="foot"><span class="dot" id="statusDot"></span><span id="statusText">უკავშირდება...</span></div>
  <div class="reset"><a onclick="resetKey()">გასაღების შეცვლა</a></div>
</div>

<script>
const KEY_STORE = "finnhub_api_key";
const SYM_STORE = "stock_symbols";
const PF_STORE = "stock_portfolio";
const DEFAULT_SYMBOLS = ["ORCL", "FLUT"];
const NAMES = { ORCL: "Oracle", FLUT: "Flutter Ent." };

let API_KEY = "";
let symbols = [];
let portfolio = {};
let lastPrice = {};
let timer = null;
let searchTimer = null;

function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
// ველის ფორმატირება 1000-ეულებით (ჩვენებისთვის)
function fmtInput(raw) {
  if (raw === "" || raw === null || raw === undefined) return "";
  const clean = String(raw).replace(/,/g, "");
  const parts = clean.split(".");
  const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.length > 1 ? intPart + "." + parts[1] : intPart;
}
// მძიმეების მოშორება — გამოთვლისთვის
function parseNum(raw) { return parseFloat(String(raw).replace(/,/g, "")) || 0; }

function comparison(price, base) {
  const dev = price - base;
  const pct = base ? (dev / base) * 100 : 0;
  const cls = dev > 0 ? "up-t" : dev < 0 ? "down-t" : "neutral-t";
  const sign = dev >= 0 ? "+" : "-";
  return { html: sign + "$" + fmt(Math.abs(dev)) + " (" + sign + fmt(Math.abs(pct)) + "%)", cls };
}
function getStoredKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function storeKey(k) { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }
function getStoredSymbols() {
  try { const s = localStorage.getItem(SYM_STORE); return s ? JSON.parse(s) : DEFAULT_SYMBOLS.slice(); }
  catch (e) { return DEFAULT_SYMBOLS.slice(); }
}
function storeSymbols() { try { localStorage.setItem(SYM_STORE, JSON.stringify(symbols)); } catch (e) {} }
function getStoredPortfolio() {
  try { const s = localStorage.getItem(PF_STORE); return s ? JSON.parse(s) : {}; } catch (e) { return {}; }
}
function storePortfolio() { try { localStorage.setItem(PF_STORE, JSON.stringify(portfolio)); } catch (e) {} }

async function saveKey() {
  const k = document.getElementById("keyInput").value.trim();
  const errEl = document.getElementById("keyErr");
  if (!k) { errEl.textContent = "გასაღები ცარიელია"; return; }
  errEl.textContent = "ვამოწმებ...";
  try {
    const r = await fetch("https://finnhub.io/api/v1/quote?symbol=ORCL&token=" + k);
    const q = await r.json();
    if (q.c === undefined || q.c === 0) { errEl.textContent = "გასაღები არასწორია ან ლიმიტი ამოიწურა"; return; }
    storeKey(k); API_KEY = k; startApp();
  } catch (e) { errEl.textContent = "ქსელის შეცდომა — სცადე ხელახლა"; }
}
function resetKey() {
  try { localStorage.removeItem(KEY_STORE); } catch (e) {}
  if (timer) clearInterval(timer);
  document.getElementById("main").classList.add("hidden");
  document.getElementById("keyscreen").classList.remove("hidden");
  document.getElementById("keyInput").value = "";
  document.getElementById("keyErr").textContent = "";
}

function onSearchInput() {
  const q = document.getElementById("searchInput").value.trim();
  const dd = document.getElementById("dropdown");
  if (searchTimer) clearTimeout(searchTimer);
  if (q.length < 1) { dd.classList.remove("show"); dd.innerHTML = ""; return; }
  dd.classList.add("show");
  dd.innerHTML = '<div class="opt"><span class="loading">ვეძებ...</span></div>';
  searchTimer = setTimeout(() => doSearch(q), 350);
}
async function doSearch(q) {
  const dd = document.getElementById("dropdown");
  try {
    const r = await fetch("https://finnhub.io/api/v1/search?q=" + encodeURIComponent(q) + "&token=" + API_KEY);
    const data = await r.json();
    const results = (data.result || [])
      .filter(x => x.symbol && !x.symbol.includes(".") && !x.symbol.includes(":"))
      .slice(0, 8);
    if (results.length === 0) { dd.innerHTML = '<div class="opt"><span class="empty">ვერ მოიძებნა</span></div>'; return; }
    dd.innerHTML = results.map(x =>
      '<div class="opt" onclick="pickSymbol(\'' + x.symbol + '\')">' +
      '<div class="t">' + x.symbol + '</div><div class="d">' + (x.description || "") + '</div></div>'
    ).join("");
  } catch (e) { dd.innerHTML = '<div class="opt"><span class="empty">ქსელის შეცდომა</span></div>'; }
}
function pickSymbol(sym) {
  document.getElementById("dropdown").classList.remove("show");
  document.getElementById("searchInput").value = "";
  addSymbol(sym);
}
function addTyped() {
  const sym = document.getElementById("searchInput").value.trim().toUpperCase();
  if (sym) addSymbol(sym);
}
async function addSymbol(sym) {
  const errEl = document.getElementById("searchErr");
  errEl.textContent = "";
  if (symbols.includes(sym)) { errEl.textContent = sym + " უკვე დამატებულია"; return; }
  errEl.textContent = "ვამოწმებ " + sym + "...";
  try {
    const r = await fetch("https://finnhub.io/api/v1/quote?symbol=" + sym + "&token=" + API_KEY);
    const q = await r.json();
    if (q.c === undefined || q.c === 0) { errEl.textContent = sym + " ვერ მოიძებნა"; return; }
    symbols.push(sym);
    storeSymbols();
    document.getElementById("widgets").insertAdjacentHTML("beforeend", widgetHTML(sym));
    document.getElementById("searchInput").value = "";
    errEl.textContent = "";
    fillQuote(sym, q);
  } catch (e) { errEl.textContent = "ქსელის შეცდომა"; }
}
function removeSymbol(sym) {
  symbols = symbols.filter(s => s !== sym);
  storeSymbols();
  renderWidgets();
  refresh();
}

function onPfChange(sym) {
  const qtyEl = document.getElementById("qty-" + sym);
  const invEl = document.getElementById("inv-" + sym);
  const qty = parseNum(qtyEl.value);
  const inv = parseNum(invEl.value);
  // ვიზუალური ფორმატირება — კურსორის ბოლოში
  qtyEl.value = fmtInput(qtyEl.value);
  invEl.value = fmtInput(invEl.value);
  portfolio[sym] = { qty, invested: inv };
  storePortfolio();
  updatePortfolio(sym);
}
function updatePortfolio(sym) {
  const pf = portfolio[sym] || { qty: 0, invested: 0 };
  const price = lastPrice[sym];
  const valEl = document.getElementById("pfval-" + sym);
  const diffEl = document.getElementById("pfdiff-" + sym);
  if (!valEl || !diffEl) return;
  if (!pf.qty || price === undefined) { valEl.textContent = "—"; diffEl.textContent = ""; diffEl.className = "pf-diff"; return; }
  const value = pf.qty * price;
  valEl.textContent = "$" + fmt(value);
  if (pf.invested > 0) {
    const diff = value - pf.invested;
    const pct = (diff / pf.invested) * 100;
    const sign = diff >= 0 ? "+" : "-";
    diffEl.textContent = sign + "$" + fmt(Math.abs(diff)) + " (" + sign + fmt(Math.abs(pct)) + "%)";
    diffEl.className = "pf-diff " + (diff > 0 ? "up-t" : diff < 0 ? "down-t" : "neutral-t");
  } else { diffEl.textContent = ""; diffEl.className = "pf-diff"; }
}

function widgetHTML(sym) {
  const name = NAMES[sym] || "";
  const pf = portfolio[sym] || { qty: "", invested: "" };
  const qtyV = pf.qty ? fmtInput(pf.qty) : "";
  const invV = pf.invested ? fmtInput(pf.invested) : "";
  return '<div class="widget" id="w-' + sym + '">' +
    '<div class="wleft">' +
      '<div class="wl-head"><div><span class="sym">' + sym + '</span><span class="name">' + name + '</span></div>' +
      '<span class="del" onclick="removeSymbol(\'' + sym + '\')">✕</span></div>' +
      '<div class="price skeleton" id="price-' + sym + '">—</div>' +
      '<div class="line">დღეს გახსნა <span class="num" id="open-' + sym + '">—</span> <span id="cmp-open-' + sym + '"></span></div>' +
      '<div class="line">გუშინ დახურვა <span class="num" id="pc-' + sym + '">—</span> <span id="cmp-pc-' + sym + '"></span></div>' +
    '</div>' +
    '<div class="wright">' +
      '<div class="pf-lbl">ინვესთმენტი</div>' +
      '<input type="text" inputmode="decimal" id="qty-' + sym + '" placeholder="ცალი" value="' + qtyV + '" oninput="onPfChange(\'' + sym + '\')">' +
      '<input type="text" inputmode="decimal" id="inv-' + sym + '" placeholder="ჩადებული $" value="' + invV + '" oninput="onPfChange(\'' + sym + '\')">' +
      '<div class="pf-lbl" style="margin-top:2px">ღირებულება</div>' +
      '<div class="pf-val" id="pfval-' + sym + '">—</div>' +
      '<div class="pf-diff" id="pfdiff-' + sym + '"></div>' +
      '<div class="updated" id="upd-' + sym + '"></div>' +
    '</div>' +
  '</div>';
}
function renderWidgets() {
  document.getElementById("widgets").innerHTML = symbols.map(widgetHTML).join("");
  symbols.forEach(updatePortfolio);
}

function fillQuote(sym, q) {
  const price = q.c, chg = q.d;
  lastPrice[sym] = price;
  const up = chg > 0, down = chg < 0;
  const wEl = document.getElementById("w-" + sym);
  if (!wEl) return;
  wEl.className = "widget " + (up ? "up" : down ? "down" : "");
  const priceEl = document.getElementById("price-" + sym);
  priceEl.textContent = "$" + fmt(price); priceEl.classList.remove("skeleton");
  document.getElementById("open-" + sym).textContent = "$" + fmt(q.o);
  const co = comparison(price, q.o);
  const coEl = document.getElementById("cmp-open-" + sym); coEl.className = co.cls; coEl.textContent = co.html;
  document.getElementById("pc-" + sym).textContent = "$" + fmt(q.pc);
  const cp = comparison(price, q.pc);
  const cpEl = document.getElementById("cmp-pc-" + sym); cpEl.className = cp.cls; cpEl.textContent = cp.html;
  updatePortfolio(sym);
  const updEl = document.getElementById("upd-" + sym);
  if (updEl) updEl.textContent = "განახლდა " + new Date().toLocaleTimeString("ka-GE");
}
async function loadQuote(sym) {
  const r = await fetch("https://finnhub.io/api/v1/quote?symbol=" + sym + "&token=" + API_KEY);
  const q = await r.json();
  if (q.c === undefined || q.c === 0) throw new Error("no data");
  fillQuote(sym, q);
}
async function refresh() {
  let ok = false;
  for (const s of symbols) { try { await loadQuote(s); ok = true; } catch (e) {} }
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  if (ok) { dot.className = "dot live"; txt.textContent = "ცოცხალი · " + new Date().toLocaleTimeString("ka-GE"); }
  else { dot.className = "dot"; txt.textContent = "ფასი ვერ ჩაიტვირთა"; }
}
function startApp() {
  document.getElementById("keyscreen").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  symbols = getStoredSymbols();
  portfolio = getStoredPortfolio();
  renderWidgets();
  refresh();
  timer = setInterval(refresh, 15000);
  const si = document.getElementById("searchInput");
  si.addEventListener("input", onSearchInput);
  si.addEventListener("keydown", e => { if (e.key === "Enter") { addTyped(); document.getElementById("dropdown").classList.remove("show"); } });
  document.addEventListener("click", e => {
    if (!e.target.closest(".searchwrap")) document.getElementById("dropdown").classList.remove("show");
  });
}
window.addEventListener("DOMContentLoaded", () => {
  const k = getStoredKey();
  if (k) { API_KEY = k; startApp(); }
});
</script>
</body>
